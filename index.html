<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Great Adventure — Floor Is Lava (webcam demo)</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0b0d12;
        color: #e6e6e6;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        overflow: hidden;
      }
      #game {
        width: 100vw;
        height: 100vh;
      }
      /* The webcam <video> is only a pixel source for segmentation/compositing.
         We never show it directly, so park it off-screen. */
      #webcam {
        position: fixed;
        left: -9999px;
        top: -9999px;
        width: 1px;
        height: 1px;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <video id="webcam" autoplay playsinline muted></video>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
