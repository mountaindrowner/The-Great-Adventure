<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Great Adventure</title>
<style>
  /* ===== RESET / BASE ===== */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0a08; color: #f4ead5; font-family: 'Courier New', monospace; }
  img, canvas, svg { image-rendering: pixelated; image-rendering: crisp-edges; }

  /* ===== STAGE — fixed 1920x1080 scaled to viewport ===== */
  #stage-wrap { position: fixed; inset: 0; display: grid; place-items: center; background: #000; }
  #stage {
    position: relative;
    width: 1920px; height: 1080px;
    transform-origin: center center;
    /* Parchment / treasure-map backdrop */
    background:
      radial-gradient(ellipse at 30% 25%, #f9e4a2 0%, transparent 55%),
      radial-gradient(ellipse at 80% 70%, #f0c87a 0%, transparent 50%),
      linear-gradient(180deg, #e7c578 0%, #d8a64c 45%, #b97a2f 100%);
    overflow: hidden;
  }
  /* parchment texture spots */
  #stage::before {
    content: ''; position: absolute; inset: 0;
    background:
      radial-gradient(circle at 12% 60%, #00000020 0 8px, transparent 9px),
      radial-gradient(circle at 88% 35%, #00000015 0 14px, transparent 16px),
      radial-gradient(circle at 50% 90%, #00000010 0 22px, transparent 24px),
      radial-gradient(circle at 22% 18%, #00000008 0 30px, transparent 32px);
    pointer-events: none;
  }

  /* ===== DECOR ===== */
  .deco { position: absolute; pointer-events: none; }
  .cave { left: 60px; top: 460px; font-size: 100px; filter: drop-shadow(0 6px 0 #0008); }
  .palm-l { left: 30px; top: 60px; font-size: 90px; transform: rotate(-12deg); }
  .palm-r { right: 80px; top: 60px; font-size: 90px; transform: rotate(12deg); }
  .x-mark { right: 110px; bottom: 280px; font-size: 80px; color: #c0392b; font-weight: bold; text-shadow: 0 4px 0 #2a1808; }
  .compass { left: 60px; bottom: 280px; font-size: 100px; opacity: .8; }

  /* ===== SVG PATH LAYER ===== */
  #paths { position: absolute; inset: 0; pointer-events: none; }
  .path-line { stroke: #5a2e10; stroke-width: 8; stroke-dasharray: 18 14; fill: none; opacity: .55; }
  .path-line.shortcut { stroke: #8b3a0e; stroke-dasharray: 12 10; opacity: .65; }

  /* ===== BOARD TILES ===== */
  .tile {
    position: absolute;
    width: 110px; height: 110px;
    border: 6px solid #2a1808;
    border-radius: 22px;
    display: grid; place-items: center;
    font-size: 50px;
    box-shadow: 0 8px 0 #2a1808, inset 0 0 0 4px #f4ead588, inset 0 -8px 18px #00000040;
    transform: translate(-55px, -55px);
    background: #c9a868;
    transition: transform .15s, box-shadow .15s, filter .15s;
  }
  .tile .lbl { position: absolute; top: -2px; left: 6px; font-size: 14px; color: #2a1808; font-weight: bold; opacity: .55; }
  .tile.start    { background: linear-gradient(180deg, #7ed957, #4a9c2c); color: #fff; }
  .tile.coin     { background: linear-gradient(180deg, #ffd55a, #e89c1e); }
  .tile.trivia   { background: linear-gradient(180deg, #6bb8ff, #3060d8); color: #fff; }
  .tile.sanctuary{ background: linear-gradient(180deg, #c9e8ff, #80b0e0); }
  .tile.minigame { background: linear-gradient(180deg, #d997ff, #8e3acd); color: #fff; }
  .tile.shortcut-tile { background: linear-gradient(180deg, #ffcb8c, #d97a2c); }
  .tile.highlight { transform: translate(-55px, -55px) scale(1.15); filter: brightness(1.3); z-index: 5; }
  .tile.warp-target { cursor: pointer; }
  .tile.warp-target:hover { transform: translate(-55px, -55px) scale(1.12); filter: brightness(1.25); box-shadow: 0 8px 0 #2a1808, 0 0 32px #fff; }
  .tile.warp-disabled { filter: grayscale(.7) brightness(.6); pointer-events: none; }
  .tile.trap-pick { cursor: pointer; outline: 4px dashed #ffd55a; outline-offset: 4px; }
  .tile .overlay {
    position: absolute; top: -22px; right: -14px;
    font-size: 50px;
    filter: drop-shadow(0 3px 0 #2a1808);
    animation: bobble 1.4s ease-in-out infinite;
  }
  .tile .pickup {
    position: absolute; bottom: -16px; left: 50%; transform: translateX(-50%);
    font-size: 30px;
    filter: drop-shadow(0 2px 0 #2a1808);
    animation: spinCoin 1.6s ease-in-out infinite;
  }
  @keyframes bobble { 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-6px); } }
  @keyframes spinCoin { 0%,100%{ transform: translateX(-50%) scaleX(1); } 50%{ transform: translateX(-50%) scaleX(0.3); } }

  .tile.coin::after {
    content: ''; position: absolute; inset: -8px; border-radius: 26px;
    background: radial-gradient(circle, #fff8 0%, transparent 60%);
    animation: shimmer 2.4s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes shimmer { 0%,100%{ opacity: .3; } 50%{ opacity: .8; } }

  /* ===== TEAM TOKENS ===== */
  .token {
    position: absolute;
    width: 90px; height: 90px;
    display: grid; place-items: center;
    font-size: 64px;
    transform: translate(-45px, -45px);
    transition: left .35s cubic-bezier(.4,1.6,.6,1), top .35s cubic-bezier(.4,1.6,.6,1);
    pointer-events: none;
    filter: drop-shadow(0 4px 0 #00000080);
    z-index: 10;
  }
  .token.active { animation: bounce 0.6s ease-in-out infinite; }
  @keyframes bounce { 0%,100%{ translate: 0 0; } 50%{ translate: 0 -12px; } }
  .token-flag {
    position: absolute; left: 50%; top: -18px; transform: translateX(-50%);
    width: 24px; height: 24px; border-radius: 50%;
    border: 3px solid #2a1808;
    box-shadow: 0 2px 0 #2a1808;
  }

  /* ===== HUD (bottom strip) ===== */
  #hud {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 220px;
    background: linear-gradient(180deg, #2a1808ee, #0b0804f0);
    border-top: 6px solid #f4ead5;
    display: grid;
    grid-template-columns: 320px 1fr 1fr 320px;
    gap: 16px;
    padding: 16px 24px;
    z-index: 50;
  }
  #hud.compact { height: 110px; padding: 8px 24px; }
  .panel {
    background: #2a1808;
    border: 4px solid #f4ead5;
    border-radius: 12px;
    padding: 12px 16px;
    color: #f4ead5;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .panel h3 { font-size: 22px; margin-bottom: 6px; letter-spacing: 1px; }
  #turn-panel .turn-counter {
    font-size: 64px; font-weight: bold; color: #ffd55a; line-height: 1;
    text-shadow: 0 3px 0 #2a1808, 0 0 16px #ffd55a80;
  }
  #turn-panel .turn-counter .of { font-size: 36px; color: #f4ead5; opacity: .65; }
  #turn-panel .turn-active { font-size: 22px; margin-top: 8px; }
  #turn-panel .phase { font-size: 16px; opacity: .8; margin-top: auto; }

  .panel.team { border-width: 8px; }
  .panel.team.active { box-shadow: 0 0 32px currentColor, inset 0 0 16px currentColor; }
  .panel.team .row1 { display: flex; align-items: center; gap: 14px; }
  .panel.team .mascot { font-size: 64px; filter: drop-shadow(0 3px 0 #2a1808); }
  .panel.team .name { font-size: 30px; font-weight: bold; letter-spacing: 1px; }
  .panel.team .flags { font-size: 28px; margin-left: auto; }
  .panel.team .coins {
    font-size: 56px; font-weight: bold; color: #ffd55a;
    text-shadow: 0 3px 0 #2a1808;
    margin: 4px 0;
  }
  .panel.team .coins .lbl-suffix { font-size: 22px; color: #f4ead5; opacity: .7; margin-left: 8px; }
  .panel.team .inv { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .powerchip {
    background: #f4ead5; color: #2a1808;
    border: 2px solid #2a1808; border-radius: 6px;
    padding: 3px 8px; font-size: 14px; font-weight: bold;
    cursor: pointer;
    font-family: inherit;
  }
  .powerchip:hover { background: #ffd55a; }
  .powerchip:disabled { opacity: .4; cursor: not-allowed; }

  /* ===== PRIMARY ACTION + CONTROLS ===== */
  #controls { display: flex; flex-direction: column; gap: 8px; }
  #primary-btn {
    flex: 1;
    background: #6abf3c; color: #0b1220;
    font-family: inherit; font-size: 32px; font-weight: bold;
    border: 5px solid #f4ead5; border-radius: 12px;
    cursor: pointer; letter-spacing: 2px;
    box-shadow: 0 6px 0 #2a1808;
    transition: transform .08s, box-shadow .08s;
    padding: 6px;
  }
  #primary-btn:hover { filter: brightness(1.1); }
  #primary-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #2a1808; }
  #primary-btn:disabled { background: #5a5a5a; cursor: not-allowed; opacity: .6; }
  .ctrl-row { display: flex; gap: 6px; }
  .smallbtn {
    background: #4a3a20; color: #f4ead5;
    border: 3px solid #f4ead5; border-radius: 8px;
    padding: 6px 8px; font-family: inherit; font-size: 13px;
    cursor: pointer; flex: 1;
  }
  .smallbtn:hover { background: #6a5a40; }

  /* ===== DICE OVERLAY ===== */
  #dice-overlay {
    position: absolute; inset: 0;
    display: none; place-items: center;
    background: #0b1220a0;
    z-index: 100;
  }
  #dice-overlay.show { display: grid; }
  #dice {
    width: 200px; height: 200px;
    background: #f4ead5; color: #2a1808;
    border: 8px solid #2a1808; border-radius: 24px;
    display: grid; place-items: center;
    font-size: 140px; font-weight: bold;
    box-shadow: 0 16px 0 #2a1808, 0 0 80px #ffd55a;
  }
  #dice.rolling { animation: diceShake .08s linear infinite; }
  @keyframes diceShake {
    0% { transform: rotate(-12deg) translate(-4px, 2px); }
    25% { transform: rotate(8deg) translate(4px, -3px); }
    50% { transform: rotate(-6deg) translate(-2px, 4px); }
    75% { transform: rotate(10deg) translate(3px, -2px); }
    100% { transform: rotate(-12deg) translate(-4px, 2px); }
  }
  #dice-boost { margin-top: 16px; font-size: 28px; color: #ffd55a; text-shadow: 0 2px 0 #2a1808; }

  /* ===== MODAL ===== */
  #modal {
    position: absolute; inset: 0;
    display: none; place-items: center;
    background: #0b1220cc;
    z-index: 90;
  }
  #modal.show { display: grid; }
  .card {
    width: 1200px; max-width: 90%; max-height: 740px;
    background: linear-gradient(180deg, #f4ead5, #d9c89a);
    color: #2a1808;
    border: 8px solid #2a1808;
    border-radius: 24px;
    padding: 32px 44px;
    box-shadow: 0 20px 0 #2a1808;
    display: flex; flex-direction: column; gap: 20px;
  }
  .card .badge { font-size: 22px; letter-spacing: 4px; opacity: .7; }
  .card h1 { font-size: 56px; line-height: 1.1; }
  .card .body { font-size: 30px; line-height: 1.3; flex: 1; }

  /* Trivia T/F choices */
  .tf-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .tf-choice {
    background: #fffaee; color: #2a1808;
    border: 6px solid #2a1808; border-radius: 16px;
    padding: 28px; font-family: inherit; font-size: 64px; font-weight: bold;
    cursor: pointer; text-align: center;
    transition: transform .08s;
    box-shadow: 0 6px 0 #2a1808;
  }
  .tf-choice:hover { background: #ffd55a; transform: scale(1.02); }
  .tf-choice.picked { background: #ffd55a; transform: scale(1.05); }
  .tf-choice.correct { background: #6abf3c; color: #fff; }
  .tf-choice.incorrect { background: #d64a4a; color: #fff; }
  .tf-choice .letter { font-size: 36px; opacity: .7; display: block; margin-bottom: 4px; }

  .card-actions { display: flex; gap: 16px; justify-content: flex-end; }
  .cardbtn {
    background: #6abf3c; color: #fff;
    border: 5px solid #2a1808; border-radius: 12px;
    padding: 14px 28px; font-family: inherit; font-size: 24px; font-weight: bold;
    cursor: pointer;
    box-shadow: 0 6px 0 #2a1808;
  }
  .cardbtn.wrong { background: #d64a4a; }
  .cardbtn.neutral { background: #6a5a40; }
  .cardbtn.big { font-size: 36px; padding: 22px 48px; }
  .cardbtn:active { transform: translateY(3px); box-shadow: 0 3px 0 #2a1808; }
  .cardbtn:disabled { opacity: .4; cursor: not-allowed; }

  /* Path-choice modal */
  .path-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .path-btn {
    background: #fffaee; color: #2a1808;
    border: 6px solid #2a1808; border-radius: 16px;
    padding: 24px; font-family: inherit; font-size: 28px; font-weight: bold;
    cursor: pointer;
    box-shadow: 0 6px 0 #2a1808;
  }
  .path-btn .arrow { display: block; font-size: 80px; margin-bottom: 12px; }
  .path-btn .tile-type { font-size: 20px; opacity: .7; margin-top: 8px; }
  .path-btn:hover { background: #ffd55a; }
  .path-btn:active { transform: translateY(3px); box-shadow: 0 3px 0 #2a1808; }

  /* Power-up cards */
  .powerup-icon { font-size: 180px; text-align: center; }
  .powerup-name { font-size: 60px; text-align: center; font-weight: bold; color: #8e3acd; }
  .powerup-desc { font-size: 26px; text-align: center; }

  /* Mini-game framework */
  .mg-card { gap: 16px; }
  .mg-icon { font-size: 140px; text-align: center; line-height: 1; }
  .mg-name { font-size: 56px; text-align: center; font-weight: bold; color: #8e3acd; }
  .mg-blurb { font-size: 28px; text-align: center; }
  .mg-step { font-size: 18px; opacity: .6; text-align: center; letter-spacing: 3px; }
  .mg-host-notice {
    background: #2a1808; color: #ffd55a;
    border-radius: 12px; padding: 24px; font-size: 26px; text-align: center;
    line-height: 1.4;
  }
  .winner-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
  .winner-btn {
    background: #fffaee; border: 5px solid currentColor; border-radius: 12px;
    padding: 20px; font-family: inherit; font-size: 28px; font-weight: bold;
    cursor: pointer; color: #2a1808;
  }
  .winner-btn .mascot { font-size: 60px; display: block; }

  /* Slow Reveal */
  #sr-stage {
    background: #0b0a08; border-radius: 16px; padding: 32px;
    min-height: 380px; display: grid; place-items: center;
    overflow: hidden;
  }
  #sr-emoji {
    font-size: 240px; filter: blur(40px);
    transition: filter .4s;
  }
  #sr-caption {
    font-size: 32px; text-align: center; min-height: 40px;
    color: #ffd55a; font-weight: bold;
  }
  #sr-controls { display: flex; gap: 12px; justify-content: center; }

  /* Picker wheel */
  #mg-wheel {
    background: #2a1808; color: #ffd55a;
    border: 5px solid #2a1808; border-radius: 16px;
    padding: 24px; font-size: 56px; text-align: center; font-weight: bold;
    min-height: 130px; display: grid; place-items: center;
  }
  #mg-wheel.spinning { animation: wheelFlash .12s linear infinite; }
  @keyframes wheelFlash {
    0% { background: #2a1808; color: #ffd55a; }
    50% { background: #8e3acd; color: #fff; }
    100% { background: #2a1808; color: #ffd55a; }
  }

  /* ===== VICTORY ===== */
  #victory {
    position: absolute; inset: 0;
    display: none; place-items: center;
    background: #0b1220e8;
    z-index: 95; flex-direction: column;
    gap: 12px;
  }
  #victory.show { display: flex; }
  #victory .trophy { font-size: 200px; animation: victoryBounce 1.2s ease-in-out infinite; }
  #victory h1 {
    font-size: 100px;
    text-shadow: 0 6px 0 #2a1808, 0 0 60px currentColor;
  }
  #victory h2 { font-size: 56px; color: #f4ead5; }
  #victory .scores {
    display: flex; gap: 80px; margin: 20px 0; font-size: 56px;
  }
  #victory .scores .score-item { text-align: center; }
  #victory .scores .label { font-size: 28px; opacity: .8; }
  #victory .scores .num { font-size: 80px; font-weight: bold; }
  @keyframes victoryBounce { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  .confetti { position: absolute; width: 16px; height: 16px; pointer-events: none; }

  /* ===== TOAST ===== */
  #toast {
    position: absolute; top: 80px; left: 50%; transform: translateX(-50%);
    background: #2a1808; color: #f4ead5;
    border: 4px solid #f4ead5; border-radius: 12px;
    padding: 14px 28px; font-size: 24px;
    z-index: 200; opacity: 0; pointer-events: none;
    transition: opacity .3s;
    max-width: 80%; text-align: center;
  }
  #toast.show { opacity: 1; }

  /* ===== KEY HINTS ===== */
  #keyhints {
    position: absolute; top: 16px; right: 16px;
    background: #2a1808d0; color: #f4ead5;
    border: 2px solid #f4ead5; border-radius: 8px;
    padding: 8px 14px; font-size: 13px;
    z-index: 40; line-height: 1.6;
    max-width: 280px;
  }
  kbd { background: #f4ead5; color: #2a1808; padding: 1px 6px; border-radius: 3px; font-weight: bold; font-size: 12px; }

  /* Title banner */
  #title {
    position: absolute; top: 14px; left: 14px;
    background: #2a1808; color: #ffd55a;
    border: 3px solid #f4ead5; border-radius: 10px;
    padding: 8px 16px; font-size: 22px; font-weight: bold;
    letter-spacing: 3px; z-index: 40;
    text-shadow: 0 2px 0 #5a2e10;
  }
</style>
</head>
<body>
<div id="stage-wrap"><div id="stage">

  <!-- Decor -->
  <div class="deco palm-l">🌴</div>
  <div class="deco palm-r">🌴</div>
  <div class="deco cave">🕳️</div>
  <div class="deco x-mark">X</div>
  <div class="deco compass">🧭</div>

  <!-- Title -->
  <div id="title">⚓ THE GREAT ADVENTURE ⚓</div>

  <!-- Key hints -->
  <div id="keyhints">
    <b>KEYS</b><br>
    <kbd>SPACE</kbd> primary &nbsp; <kbd>T</kbd>/<kbd>F</kbd> true/false<br>
    <kbd>↵</kbd> correct &nbsp; <kbd>⌫</kbd> wrong<br>
    <kbd>←</kbd>/<kbd>→</kbd> pick / reveal<br>
    <kbd>1</kbd>/<kbd>2</kbd> winner Red/Blue<br>
    <kbd>Q</kbd>/<kbd>W</kbd> ±1 coin &nbsp; <kbd>U</kbd> undo<br>
    <kbd>M</kbd> mute &nbsp; <kbd>F</kbd> fullscreen
  </div>

  <!-- SVG path-lines -->
  <svg id="paths" viewBox="0 0 1920 1080" preserveAspectRatio="none"></svg>

  <!-- Board tiles + tokens -->
  <div id="board"></div>
  <div id="tokens"></div>

  <!-- Toast -->
  <div id="toast"></div>

  <!-- Dice overlay -->
  <div id="dice-overlay">
    <div style="text-align:center">
      <div id="dice">?</div>
      <div id="dice-boost"></div>
    </div>
  </div>

  <!-- Modal -->
  <div id="modal">
    <div class="card" id="card-body"></div>
  </div>

  <!-- Victory -->
  <div id="victory">
    <div class="trophy">🏆</div>
    <h1 id="victory-team">WINNER!</h1>
    <h2 id="victory-sub">The Great Adventure</h2>
    <div class="scores">
      <div class="score-item"><div class="label">🦊 RED</div><div class="num" id="victory-red">0</div></div>
      <div class="score-item"><div class="label">🐬 BLUE</div><div class="num" id="victory-blue">0</div></div>
    </div>
    <button class="cardbtn big" id="victory-reset">PLAY AGAIN</button>
  </div>

  <!-- HUD -->
  <div id="hud">
    <div class="panel" id="turn-panel">
      <h3>TURN</h3>
      <div><span class="turn-counter" id="turn-num">1</span><span class="turn-counter of"> / 12</span></div>
      <div class="turn-active" id="turn-active">RED TEAM's turn</div>
      <div class="phase" id="phase-text">Awaiting roll</div>
    </div>

    <div class="panel team" id="team-0"></div>
    <div class="panel team" id="team-1"></div>

    <div id="controls">
      <button id="primary-btn">ROLL</button>
      <div class="ctrl-row">
        <button class="smallbtn" id="btn-undo">UNDO (U)</button>
        <button class="smallbtn" id="btn-mute">🔊 (M)</button>
      </div>
      <div class="ctrl-row">
        <button class="smallbtn" id="btn-fs">FULLSCREEN (F)</button>
        <button class="smallbtn" id="btn-hud">HUD (Tab)</button>
      </div>
    </div>
  </div>

</div></div>

<script>
'use strict';

// =====================================================================
// CONSTANTS & CONFIG
// =====================================================================

const TURN_LIMIT = 12; // turns per team

const COIN_REWARD = 5;       // landing on a coin tile
const TRIVIA_REWARD = 3;     // correct trivia
const MINIGAME_REWARD = 10;  // winning a mini-game
const TRAP_PENALTY = 4;      // banana trap penalty
const COIN_DROP_LOSS = 5;    // coins stolen by Coin Drop
const COIN_DROP_PICKUPS = 5; // pickup tiles spawned

// Random chance to earn a power-up alongside other rewards
const POWERUP_CHANCE_COIN = 0.30;     // 30% on coin-space landing
const POWERUP_CHANCE_TRIVIA = 0.25;   // 25% on trivia correct
const POWERUP_CHANCE_MINIGAME = 1.0;  // 100% on mini-game win

const TEAMS_INIT = [
  { id: 'red',  name: 'RED TEAM',  mascot: '🦊', color: '#e84a3a' },
  { id: 'blue', name: 'BLUE TEAM', mascot: '🐬', color: '#3a8aff' },
];

const POWERUPS = {
  freeze:     { id: 'freeze',     name: 'Freeze',      icon: '❄️', desc: 'Opponent skips their next turn.' },

function snapshot() {
  history.push(JSON.parse(JSON.stringify(state)));
  if (history.length > 50) history.shift();
}
function undo() {
  if (!history.length) { toast('Nothing to undo'); return; }
  cancelPendingTimers();
  state = history.pop();
  closeAllModals();
  renderAll();
  toast('Undid last action');
}
function cancelPendingTimers() {
  for (const t of pendingTimers) clearTimeout(t);
  pendingTimers = [];
}
function later(fn, ms) {
  const id = setTimeout(() => {
    pendingTimers = pendingTimers.filter(x => x !== id);
    fn();
  }, ms);
  pendingTimers.push(id);
  return id;
}

let audioCtx = null, musicGain = null, musicTimer = null;
function ensureAudio() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    musicGain = audioCtx.createGain();
    musicGain.gain.value = 0.05;
    musicGain.connect(audioCtx.destination);
    startMusic();
  } catch (e) {}
}
function beep(freq, dur, type='sine', vol=0.18) {
  if (!audioCtx || state.muted) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + dur);
}
function sequence(notes, type='triangle', vol=0.18) {
  let t = 0;
  for (const [freq, dur] of notes) {
    setTimeout(() => beep(freq, dur, type, vol), t * 1000);
    t += dur * 0.9;
  }
}
const SFX = {
  roll:     () => { for (let i=0;i<5;i++) setTimeout(()=>beep(200 + Math.random()*200, 0.05, 'square', 0.1), i*60); },
  hop:      () => beep(523, 0.08, 'triangle', 0.14),
  land:     () => sequence([[523,0.08],[659,0.12]], 'triangle'),
  coin:     () => sequence([[784,0.06],[1047,0.10]], 'triangle', 0.22),
  correct:  () => sequence([[523,0.1],[659,0.1],[784,0.18]], 'triangle', 0.22),
  wrong:    () => sequence([[330,0.12],[247,0.22]], 'sawtooth', 0.16),
  trap:     () => sequence([[300,0.15],[200,0.25]], 'sawtooth', 0.20),
  warp:     () => sequence([[440,0.1],[660,0.1],[880,0.1],[660,0.2]], 'sine', 0.15),
  freeze:   () => sequence([[440,0.1],[330,0.18]], 'sine', 0.16),
  powerup:  () => sequence([[523,0.06],[659,0.06],[784,0.06],[1047,0.15]], 'triangle', 0.20),
  minigame: () => sequence([[392,0.1],[523,0.1],[659,0.1],[784,0.18]], 'square', 0.16),
  victory:  () => sequence([[523,0.15],[659,0.15],[784,0.15],[1047,0.4]], 'triangle', 0.25),
  click:    () => beep(880, 0.04, 'square', 0.10),
};
function startMusic() {
  const pattern = [261.63, 329.63, 392.00, 329.63, 293.66, 349.23, 440.00, 349.23];
  let i = 0;
  function step() {
    if (!audioCtx || state.muted) { musicTimer = setTimeout(step, 500); return; }
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sine'; o.frequency.value = pattern[i % pattern.length];
    g.gain.setValueAtTime(0, audioCtx.currentTime);
    g.gain.linearRampToValueAtTime(0.04, audioCtx.currentTime + 0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.55);
    o.connect(g); g.connect(musicGain);
    o.start(); o.stop(audioCtx.currentTime + 0.6);
    i++;
    musicTimer = setTimeout(step, 500);
  }
  step();
}

  state.muted = !state.muted;

function rollDice() {
  if (state.phase !== 'awaiting-roll') return;
  ensureAudio();

  const active = state.teams[state.activeIdx];

  // Skip-next check (Freeze effect)
  if (active.skipNext) {
    snapshot();
    active.skipNext = false;
    toast(`${active.name} is FROZEN this turn ❄️`);
    SFX.freeze();
    later(() => passTurn(), 1200);
    return;
  }

  snapshot();
  state.phase = 'rolling';
  renderHUD();
  SFX.roll();

  const overlay = document.getElementById('dice-overlay');
  const dice = document.getElementById('dice');
  const boost = document.getElementById('dice-boost');
  overlay.classList.add('show');
  dice.classList.add('rolling');
  dice.textContent = '?';
  boost.textContent = active.speedBoost ? '⚡ +3 SPEED BOOST!' : '';

  let ticks = 0;
  const flicker = setInterval(() => {
    dice.textContent = 1 + Math.floor(Math.random() * 6);
    ticks++;
    if (ticks > 14) {
      clearInterval(flicker);
      let result = 1 + Math.floor(Math.random() * 6);
      if (active.speedBoost) {
        result += 3;
        active.speedBoost = false;
      }
      dice.textContent = result;
      dice.classList.remove('rolling');
      state.lastRoll = result;
      later(() => {
        overlay.classList.remove('show');
        boost.textContent = '';
        beginMove(result);
      }, 850);
    }
  }, 70);
}

function beginMove(steps) {
  state.phase = 'moving';
  state.movePath = [];
  renderHUD();
  doMoveStep(steps);
}

function doMoveStep(remaining) {
  if (remaining <= 0) {
    // Finished moving — land
    const team = state.teams[state.activeIdx];
    SFX.land();
    later(() => landOn(team.position), 250);
    return;
  }
  const team = state.teams[state.activeIdx];
  const node = BOARD_GRAPH[team.position];

  // Branching check
  if (node.next.length > 1) {
    showPathChoice(node, (chosenNext) => {
      hopTo(chosenNext, remaining);
    });
    return;
  }

  hopTo(node.next[0], remaining);
}

function hopTo(nextId, remaining) {
  const team = state.teams[state.activeIdx];
  team.position = nextId;
  SFX.hop();
  renderTokens();

  // Pickup coin drops on pass-through
  if (state.coinDrops[nextId]) {
    const amt = state.coinDrops[nextId];
    delete state.coinDrops[nextId];
    team.coins += amt;
    SFX.coin();
    toast(`${team.name} picked up ${amt} coin${amt > 1 ? 's' : ''}!`);
    renderBoard();
    renderHUD();
  }

  // Trap check on pass-through (also triggered on landing further down)
  if (state.traps[nextId] && remaining > 1) {
    // Mid-traversal — still trigger trap
    triggerTrap(nextId);
    return;
  }

  later(() => doMoveStep(remaining - 1), 360);
}

function triggerTrap(nodeId) {
  const team = state.teams[state.activeIdx];
  const trap = state.traps[nodeId];
  delete state.traps[nodeId];

  if (team.sanctuary) {
    toast(`${team.name}'s Sanctuary 🛡️ blocked the trap!`);
    SFX.land();
    renderBoard();
    later(() => passTurn(), 1200);
    return;
  }

  const loss = Math.min(TRAP_PENALTY, team.coins);
  team.coins -= loss;
  SFX.trap();
  toast(`${team.mascot} ${team.name} stumbled on a 🍌 trap! -${loss} coins`);
  renderBoard();
  renderHUD();
  later(() => passTurn(), 1500);
}

function showPathChoice(node, onPick) {
  state.phase = 'awaiting-path-pick';
  renderHUD();
  const active = state.teams[state.activeIdx];
  const choices = node.next.map((nid, idx) => {
    const dest = BOARD_GRAPH[nid];
    const arrow = idx === 0 ? '➡️' : '⬇️';
    return `<button class="path-btn" data-path="${nid}" data-key="${idx === 0 ? 'right' : 'left'}">
      <span class="arrow">${arrow}</span>
      ${idx === 0 ? 'KEEP GOING' : 'TAKE SHORTCUT'}
      <div class="tile-type">→ ${tileLabel(dest.type)} ${tileGlyph(dest.type)}</div>
    </button>`;
  }).join('');
  showCard(`
    <div class="badge" style="color:${active.color}">${active.mascot} ${active.name} — PATH CHOICE</div>
    <h1>Pick a path!</h1>
    <div class="path-choices">${choices}</div>
    <div style="font-size:18px;opacity:.6;text-align:center">← / → keys, or click a path</div>
  `);
  let picked = false;
  document.querySelectorAll('[data-path]').forEach(btn => {
    btn.onclick = () => {
      if (picked) return;
      picked = true;
      state.phase = 'moving';
      closeModal();
      onPick(btn.dataset.path);
    };
  });
  // Stash picker for keyboard input
  state._pickPath = (which) => {
    const btns = document.querySelectorAll('[data-path]');
    const idx = which === 'right' ? 0 : (which === 'left' ? 1 : -1);
    if (idx >= 0 && btns[idx]) btns[idx].click();
  };
}

function landOn(nodeId) {
  const node = BOARD_GRAPH[nodeId];

  // Trap on landing
  if (state.traps[nodeId]) {
    triggerTrap(nodeId);
    return;
  }
  // Coin-drop pickup on landing
  if (state.coinDrops[nodeId]) {
    const team = state.teams[state.activeIdx];
    team.coins += state.coinDrops[nodeId];
    SFX.coin();
    toast(`${team.name} +${state.coinDrops[nodeId]} coins!`);
    delete state.coinDrops[nodeId];
    renderBoard();
    renderHUD();
  }

  switch (node.type) {
    case 'coin':      return resolveCoinSpace();
    case 'trivia':    return openTrivia();
    case 'sanctuary': return resolveSanctuary();
    case 'minigame':  return openMinigame();
    case 'start':
    case 'shortcut-tile':
    default:          return passTurn();
  }
}

function resolveCoinSpace() {
  const team = state.teams[state.activeIdx];
  team.coins += COIN_REWARD;
  SFX.coin();
  toast(`${team.mascot} ${team.name} +${COIN_REWARD} coins!`);
  // Power-up bonus chance
  if (Math.random() < POWERUP_CHANCE_COIN) {
    const pid = POWERUP_KEYS[Math.floor(Math.random() * POWERUP_KEYS.length)];
    team.inventory.push(pid);
    later(() => {
      SFX.powerup();
      toast(`Bonus! ${POWERUPS[pid].icon} ${POWERUPS[pid].name}`);
    }, 700);
  }
  renderHUD();
  later(() => passTurn(), 1500);
}

function resolveSanctuary() {
  const team = state.teams[state.activeIdx];
  team.sanctuary = true;
  SFX.warp();
  toast(`${team.mascot} ${team.name} is safe in Sanctuary 🛡️`);
  renderHUD();
  later(() => passTurn(), 1500);
}

// ---- Trivia ----
function openTrivia() {
  // Pick a non-repeating question
  if (usedTriviaIdx.length >= TRIVIA.length) usedTriviaIdx = [];
  let qIdx;
  do { qIdx = Math.floor(Math.random() * TRIVIA.length); } while (usedTriviaIdx.includes(qIdx));
  usedTriviaIdx.push(qIdx);

  const q = TRIVIA[qIdx];
  state.currentTrivia = q;
  state.selectedAnswer = null;
  state.phase = 'awaiting-tf';
  renderHUD();

  const active = state.teams[state.activeIdx];
  showCard(`
    <div class="badge" style="color:${active.color}">${active.mascot} ${active.name} — TRUE OR FALSE</div>
    <h1>${escapeHtml(q.q)}</h1>
    <div class="tf-choices">
      <button class="tf-choice" data-pick="true">
        <span class="letter">T</span>TRUE
      </button>
      <button class="tf-choice" data-pick="false">
        <span class="letter">F</span>FALSE
      </button>
    </div>
    <div class="card-actions" id="judgment-actions" style="display:none">
      <button class="cardbtn wrong" id="judge-wrong">WRONG (⌫)</button>
      <button class="cardbtn" id="judge-correct">CORRECT (↵)</button>
    </div>
  `);
  document.querySelectorAll('[data-pick]').forEach(btn => {
    btn.onclick = () => pickTF(btn.dataset.pick === 'true');
  });
  document.getElementById('judge-correct').onclick = () => judgeTrivia(true);
  document.getElementById('judge-wrong').onclick   = () => judgeTrivia(false);
}

function pickTF(val) {
  if (state.phase !== 'awaiting-tf' && state.phase !== 'awaiting-judgment') return;
  state.selectedAnswer = val;
  document.querySelectorAll('[data-pick]').forEach(btn => {
    btn.classList.toggle('picked', (btn.dataset.pick === 'true') === val);
  });
  document.getElementById('judgment-actions').style.display = 'flex';
  state.phase = 'awaiting-judgment';
  renderHUD();
  SFX.click();
}

function judgeTrivia(correct) {
  if (state.phase !== 'awaiting-judgment') return;
  const team = state.teams[state.activeIdx];
  const q = state.currentTrivia;
  // Highlight the actual answer
  document.querySelectorAll('[data-pick]').forEach(btn => {
    const v = btn.dataset.pick === 'true';
    if (v === q.a) btn.classList.add('correct');
    if (v === state.selectedAnswer && !correct) btn.classList.add('incorrect');
  });
  if (correct) {
    team.coins += TRIVIA_REWARD;
    SFX.correct();
    toast(`${team.name} +${TRIVIA_REWARD} coins!`);
    // Power-up bonus chance
    if (Math.random() < POWERUP_CHANCE_TRIVIA) {
      const pid = POWERUP_KEYS[Math.floor(Math.random() * POWERUP_KEYS.length)];
      team.inventory.push(pid);
      later(() => {
        SFX.powerup();
        toast(`Bonus! ${POWERUPS[pid].icon} ${POWERUPS[pid].name}`);
      }, 700);
    }
  } else {
    SFX.wrong();
    toast(`Miss — no coins this round`);
  }
  document.getElementById('judge-correct').disabled = true;
  document.getElementById('judge-wrong').disabled = true;
  state.phase = 'resolving';
  renderHUD();
  later(() => {
    closeModal();
    passTurn();
  }, 1700);
}

// ---- Mini-game framework ----
function openMinigame() {
  // Defensive: refuse to re-enter if a mini-game is already in progress
  if (state.currentMinigame || state.phase === 'resolving') return;
  state.phase = 'resolving';
  renderHUD();
  SFX.minigame();
  // Spin picker first
  showCard(`
    <div class="badge">MINI-GAME!</div>
    <h1>Drawing from the catalog...</h1>
    <div id="mg-wheel" class="spinning">${MINIGAMES[0].name}</div>
  `);
  const wheel = document.getElementById('mg-wheel');
  let i = 0, interval = 80, elapsed = 0;
  const tick = () => {
    wheel.textContent = MINIGAMES[i % MINIGAMES.length].name;
    i++;
    elapsed += interval;
    if (elapsed >= 2200) {
      wheel.classList.remove('spinning');
      const game = MINIGAMES[Math.floor(Math.random() * MINIGAMES.length)];
      state.currentMinigame = game;
      wheel.textContent = game.name;
      SFX.land();
      later(() => beginMinigameInstructions(), 800);
      return;
    }
    interval *= 1.08;
    later(tick, interval);
  };
  tick();
}

function beginMinigameInstructions() {
  const g = state.currentMinigame;
  if (!g) return; // stale callback after a passTurn — ignore
  state.phase = 'mg-instructions';
  state.minigameStep = 'instructions';
  renderHUD();
  showCard(`
    <div class="mg-step">STEP 1 / 4 — INSTRUCTIONS</div>
    <div class="mg-icon">${g.icon}</div>
    <div class="mg-name">${g.name}</div>
    <div class="mg-blurb">${escapeHtml(g.blurb)}</div>
    <div class="card-actions">
      <button class="cardbtn big" id="mg-next-1">NEXT (SPACE)</button>
    </div>
  `);
  document.getElementById('mg-next-1').onclick = () => beginMinigameStartGate();
}

function beginMinigameStartGate() {
  const g = state.currentMinigame;
  if (!g) return;
  state.phase = 'mg-start-gate';
  state.minigameStep = 'start-gate';
  renderHUD();
  showCard(`
    <div class="mg-step">STEP 2 / 4 — READY?</div>
    <div class="mg-icon">${g.icon}</div>
    <div class="mg-name">${g.name}</div>
    <div class="mg-blurb">Presenter: explain the rules, then press START when ready.</div>
    <div class="card-actions">
      <button class="cardbtn big" id="mg-start">START! (SPACE)</button>
    </div>
  `);
  document.getElementById('mg-start').onclick = () => beginMinigameInGame();
}

function beginMinigameInGame() {
  const g = state.currentMinigame;
  if (!g) return;
  state.phase = 'mg-in-game';
  state.minigameStep = 'in-game';
  renderHUD();
  if (g.id === 'slow-reveal') {
    return renderSlowReveal();
  }
  // Host-led placeholder
  showCard(`
    <div class="mg-step">STEP 3 / 4 — IN GAME</div>
    <div class="mg-name">${g.icon} ${g.name}</div>
    <div class="mg-host-notice">
      The PRESENTER runs this game live with the kids.<br>
      When the round is done, press END GAME below to score it.
    </div>
    <div class="card-actions">
      <button class="cardbtn big" id="mg-end">END GAME (SPACE)</button>
    </div>
  `);
  document.getElementById('mg-end').onclick = () => beginMinigameScoreAward();
}

function renderSlowReveal() {
  state.srSceneIdx = Math.floor(Math.random() * SLOW_REVEAL_SCENES.length);
  state.srRevealLevel = 0;
  const scene = SLOW_REVEAL_SCENES[state.srSceneIdx];
  showCard(`
    <div class="mg-step">STEP 3 / 4 — SLOW REVEAL</div>
    <div class="mg-name">🖼️ Slow Reveal</div>
    <div id="sr-stage">
      <div id="sr-emoji">${scene.emoji}</div>
    </div>
    <div id="sr-caption"></div>
    <div id="sr-controls">
      <button class="cardbtn neutral" id="sr-reveal">REVEAL MORE (→)</button>
      <button class="cardbtn big" id="sr-end">PICK WINNER (SPACE)</button>
    </div>
  `);
  document.getElementById('sr-reveal').onclick = () => slowRevealStep();
  document.getElementById('sr-end').onclick = () => beginMinigameScoreAward();
  updateSlowRevealStage();
}

function slowRevealStep() {
  if (state.srRevealLevel < 3) {
    state.srRevealLevel++;
    SFX.click();
    updateSlowRevealStage();
  }
}

function updateSlowRevealStage() {
  const scene = SLOW_REVEAL_SCENES[state.srSceneIdx];
  const emoji = document.getElementById('sr-emoji');
  const cap = document.getElementById('sr-caption');
  if (!emoji) return;
  const blurMap = [40, 22, 10, 0];
  emoji.style.filter = `blur(${blurMap[state.srRevealLevel]}px)`;
  if (state.srRevealLevel === 3) {
    cap.textContent = scene.caption;
  } else if (state.srRevealLevel === 2) {
    cap.textContent = `Hint: ${scene.caption.split(' ').slice(0, 1).join(' ')}...`;
  } else {
    cap.textContent = '';
  }
}

function beginMinigameScoreAward() {
  const g = state.currentMinigame;
  if (!g) return;
  state.phase = 'mg-score-award';
  state.minigameStep = 'score-award';
  renderHUD();
  showCard(`
    <div class="mg-step">STEP 4 / 4 — WHO WON?</div>
    <div class="mg-name">${g.icon} ${g.name}</div>
    <div class="winner-grid">
      <button class="winner-btn" data-winner="0" style="color:${state.teams[0].color}">
        <span class="mascot">${state.teams[0].mascot}</span>${state.teams[0].name}<br>WINS
      </button>
      <button class="winner-btn" data-winner="1" style="color:${state.teams[1].color}">
        <span class="mascot">${state.teams[1].mascot}</span>${state.teams[1].name}<br>WINS
      </button>
      <button class="winner-btn" data-winner="draw" style="color:#6a5a40">
        <span class="mascot">🤝</span>DRAW<br>(no coins)
      </button>
    </div>
  `);
  document.querySelectorAll('[data-winner]').forEach(btn => {
    btn.onclick = () => awardMinigameWinner(btn.dataset.winner);
  });
}

function awardMinigameWinner(winnerKey) {
  if (state.phase !== 'mg-score-award') return; // prevent double-award
  state.phase = 'resolving';
  if (winnerKey === 'draw') {
    SFX.click();
    toast('Mini-game: draw — no coins awarded.');
  } else {
    const idx = parseInt(winnerKey);
    const winner = state.teams[idx];
    winner.coins += MINIGAME_REWARD;
    if (Math.random() < POWERUP_CHANCE_MINIGAME) {
      const pid = POWERUP_KEYS[Math.floor(Math.random() * POWERUP_KEYS.length)];
      winner.inventory.push(pid);
      toast(`${winner.mascot} ${winner.name} +${MINIGAME_REWARD} coins and ${POWERUPS[pid].name}!`);
    } else {
      toast(`${winner.mascot} ${winner.name} +${MINIGAME_REWARD} coins!`);
    }
    SFX.powerup();
  }
  closeModal();
  renderHUD();
  later(() => passTurn(), 1200);
}

// ---- Power-ups ----
function usePowerup(teamIdx, invIdx) {
  if (teamIdx !== state.activeIdx) { toast(`Wait for ${state.teams[teamIdx].name}'s turn`); return; }
  if (state.phase !== 'awaiting-roll') { toast('Use power-ups before rolling'); return; }
  const team = state.teams[teamIdx];
  const pid = team.inventory[invIdx];
  if (!pid) return;
  snapshot();
  if (pid === 'freeze') {
    const opp = state.teams[1 - teamIdx];
    if (opp.sanctuary) { toast(`${opp.name}'s Sanctuary 🛡️ blocked Freeze!`); team.inventory.splice(invIdx, 1); renderHUD(); SFX.click(); return; }
    opp.skipNext = true;
    team.inventory.splice(invIdx, 1);
    SFX.freeze();
    toast(`${opp.name} is FROZEN ❄️`);
    renderHUD();
    return;
  }
  if (pid === 'speedboost') {
    team.speedBoost = true;
    team.inventory.splice(invIdx, 1);
    SFX.powerup();
    toast(`${team.name} primed Speed Boost ⚡ (+3 on next roll)`);
    renderHUD();
    return;
  }
  if (pid === 'coindrop') {
    const opp = state.teams[1 - teamIdx];
    if (opp.sanctuary) { toast(`${opp.name}'s Sanctuary 🛡️ blocked Coin Drop!`); team.inventory.splice(invIdx, 1); renderHUD(); SFX.click(); return; }
    const loss = Math.min(COIN_DROP_LOSS, opp.coins);
    opp.coins -= loss;
    // Scatter pickups on next COIN_DROP_PICKUPS forward nodes from opponent
    const amounts = distributeCoins(loss, COIN_DROP_PICKUPS);
    const nodes = nodesAhead(opp.position, COIN_DROP_PICKUPS);
    nodes.forEach((nid, i) => {
      if (amounts[i] > 0) state.coinDrops[nid] = (state.coinDrops[nid] || 0) + amounts[i];
    });
    team.inventory.splice(invIdx, 1);
    SFX.coin();
    toast(`💸 ${opp.name} dropped ${loss} coins on the trail!`);
    renderBoard();
    renderHUD();
    return;
  }
  if (pid === 'banana') {
    // Pick target tile
    const opp = state.teams[1 - teamIdx];
    const targets = nodesAhead(opp.position, 10).filter(nid => BOARD_GRAPH[nid].type !== 'sanctuary' && !state.traps[nid]);
    if (!targets.length) {
      toast('No legal tiles for a trap right now.');
      // refund
      renderHUD();
      return;
    }
    state.pendingPowerup = { kind: 'banana', teamIdx, invIdx, targets };
    state.phase = 'awaiting-trap-pick';
    showTrapPicker(targets);
    return;
  }
  if (pid === 'warp') {
    const targets = ALL_NODE_IDS.filter(nid => BOARD_GRAPH[nid].type !== 'sanctuary' && nid !== team.position);
    state.pendingPowerup = { kind: 'warp', teamIdx, invIdx, targets };
    state.phase = 'awaiting-warp-pick';
    showWarpPicker(targets);
    return;
  }
}

function distributeCoins(total, slots) {
  const out = new Array(slots).fill(0);
  let i = 0;
  while (total > 0 && i < 1000) {
    out[i % slots]++;
    total--;
    i++;
  }
  return out;
}

function nodesAhead(startId, count) {
  const out = [];
  let cur = startId;
  for (let i = 0; i < count; i++) {
    const node = BOARD_GRAPH[cur];
    if (!node || !node.next.length) break;
    cur = node.next[0]; // always take first branch for projection
    out.push(cur);
  }
  return out;
}

function showTrapPicker(targets) {
  renderBoard();
  const set = new Set(targets);
  document.querySelectorAll('.tile').forEach(t => {
    if (set.has(t.dataset.nodeId)) {
      t.classList.add('trap-pick');
      t.onclick = () => placeTrap(t.dataset.nodeId);
    } else {
      t.classList.add('warp-disabled');
    }
  });
  renderHUD();
  toast('Click a highlighted tile to place 🍌 trap');
}

function placeTrap(nodeId) {
  const pending = state.pendingPowerup;
  if (!pending || pending.kind !== 'banana') return;
  const team = state.teams[pending.teamIdx];
  team.inventory.splice(pending.invIdx, 1);
  state.traps[nodeId] = { byTeamId: team.id };
  state.pendingPowerup = null;
  state.phase = 'awaiting-roll';
  SFX.powerup();
  toast(`🍌 Trap placed!`);
  document.querySelectorAll('.tile').forEach(t => { t.onclick = null; });
  renderAll();
}

function showWarpPicker(targets) {
  renderBoard();
  const set = new Set(targets);
  document.querySelectorAll('.tile').forEach(t => {
    if (set.has(t.dataset.nodeId)) {
      t.classList.add('warp-target');
      t.onclick = () => doWarp(t.dataset.nodeId);
    } else {
      t.classList.add('warp-disabled');
    }
  });
  renderHUD();
  toast('Click any tile to warp 🌀');
}

function doWarp(nodeId) {
  const pending = state.pendingPowerup;
  if (!pending || pending.kind !== 'warp') return;
  const team = state.teams[pending.teamIdx];
  team.inventory.splice(pending.invIdx, 1);
  state.pendingPowerup = null;
  team.position = nodeId;
  SFX.warp();
  toast(`🌀 ${team.name} warped!`);
  document.querySelectorAll('.tile').forEach(t => { t.onclick = null; });
  renderTokens();
  // Trigger the landing effect at the destination
  state.phase = 'moving';
  later(() => landOn(nodeId), 600);
}

// ---- Turn management ----
function passTurn() {
  if (state.won) return;
  // Clear sanctuary on the team that just ended their turn
  const active = state.teams[state.activeIdx];
  if (active.sanctuary) active.sanctuary = false;

  state.activeIdx = 1 - state.activeIdx;
  if (state.activeIdx === 0) state.turn++;

  // Check turn limit
  if (state.turn > TURN_LIMIT) {
    return endGame();
  }
  state.phase = 'awaiting-roll';
  state.currentTrivia = null;
  state.selectedAnswer = null;
  state.currentMinigame = null;
  state.minigameStep = null;
  renderAll();
}

function endGame() {
  state.won = true;
  state.phase = 'won';
  const [red, blue] = state.teams;
  let winnerIdx;
  if (red.coins > blue.coins)      winnerIdx = 0;
  else if (blue.coins > red.coins) winnerIdx = 1;
  else                              winnerIdx = -1;
  state.winner = winnerIdx;
  SFX.victory();

  document.getElementById('victory-red').textContent = red.coins;
  document.getElementById('victory-blue').textContent = blue.coins;
  const h1 = document.getElementById('victory-team');
  const h2 = document.getElementById('victory-sub');
  if (winnerIdx === -1) {
    h1.textContent = `IT'S A TIE!`;
    h1.style.color = '#ffd55a';
    h2.textContent = 'Both teams played hard — well done!';
  } else {
    const w = state.teams[winnerIdx];
    h1.textContent = `${w.mascot} ${w.name} WINS!`;
    h1.style.color = w.color;
    h2.textContent = `With ${w.coins} Adventure Coins`;
  }
  document.getElementById('victory').classList.add('show');
  spawnConfetti();
}

function spawnConfetti() {
  const victory = document.getElementById('victory');
  const colors = ['#ffd55a','#e84a3a','#3a8aff','#6abf3c','#8e3acd'];
  for (let i = 0; i < 100; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.background = colors[i % colors.length];
    c.style.left = Math.random() * 100 + '%';
    c.style.top = '-20px';
    c.style.transform = `rotate(${Math.random()*360}deg)`;
    victory.appendChild(c);
    if (typeof c.animate === 'function') {
      const dur = 2 + Math.random() * 3;
      c.animate([
        { transform: c.style.transform + ' translateY(0)' },
        { transform: c.style.transform + ` translateY(${window.innerHeight + 100}px) rotate(${720 + Math.random()*360}deg)` }
      ], { duration: dur * 1000, iterations: Infinity });
    }
  }
}

function resetGame() {
  cancelPendingTimers();
  history = [];
  usedTriviaIdx = [];
  state = freshState();
  document.getElementById('victory').classList.remove('show');
  document.getElementById('victory').querySelectorAll('.confetti').forEach(c => c.remove());
  closeAllModals();
  renderAll();
}

// =====================================================================
// MODAL / TOAST HELPERS
// =====================================================================

function showCard(html) {
  const modal = document.getElementById('modal');
  document.getElementById('card-body').innerHTML = html;
  modal.classList.add('show');
}
function closeModal() { document.getElementById('modal').classList.remove('show'); }
function closeAllModals() {
  closeModal();
  document.getElementById('dice-overlay').classList.remove('show');
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  later(() => t.classList.remove('show'), 1800);
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// =====================================================================
// INPUT
// =====================================================================

function onPrimary() {
  ensureAudio();
  switch (state.phase) {
    case 'awaiting-roll':   return rollDice();
    case 'mg-instructions': { document.getElementById('mg-next-1')?.click(); return; }
    case 'mg-start-gate':   { document.getElementById('mg-start')?.click(); return; }
    case 'mg-in-game': {
      const g = state.currentMinigame;
      if (g && g.id === 'slow-reveal') { document.getElementById('sr-end')?.click(); return; }
      document.getElementById('mg-end')?.click();
      return;
    }
    default: return;
  }
}

window.addEventListener('keydown', (e) => {
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
  ensureAudio();

  if (state.won) {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); resetGame(); }
    return;
  }

  switch (e.key) {
    case ' ': e.preventDefault(); onPrimary(); break;
    case 'Enter':
      if (state.phase === 'awaiting-judgment') judgeTrivia(true);
      break;
    case 'Backspace':
      if (state.phase === 'awaiting-judgment') judgeTrivia(false);
      break;
    case 't': case 'T':
      if (state.phase === 'awaiting-tf' || state.phase === 'awaiting-judgment') pickTF(true);
      break;
    case 'f': case 'F':
      if (state.phase === 'awaiting-tf' || state.phase === 'awaiting-judgment') pickTF(false);
      else if (state.phase === 'awaiting-roll') toggleFullscreen();
      break;
    case '1':
      if (state.phase === 'mg-score-award') document.querySelector('[data-winner="0"]')?.click();
      break;
    case '2':
      if (state.phase === 'mg-score-award') document.querySelector('[data-winner="1"]')?.click();
      break;
    case 'ArrowRight':
      if (state.phase === 'awaiting-path-pick') { e.preventDefault(); state._pickPath?.('right'); }
      else if (state.phase === 'mg-in-game' && state.currentMinigame?.id === 'slow-reveal') { e.preventDefault(); slowRevealStep(); }
      break;
    case 'ArrowLeft':
      if (state.phase === 'awaiting-path-pick') { e.preventDefault(); state._pickPath?.('left'); }
      break;
    case 'u': case 'U': undo(); break;
    case 'm': case 'M': toggleMute(); break;
    case 'q': case 'Q': {
      snapshot();
      state.teams[state.activeIdx].coins = Math.max(0, state.teams[state.activeIdx].coins - 1);
      toast(`${state.teams[state.activeIdx].name} -1 coin`);
      renderHUD();
      break;
    }
    case 'w': case 'W': {
      snapshot();
      state.teams[state.activeIdx].coins += 1;
      toast(`${state.teams[state.activeIdx].name} +1 coin`);
      renderHUD();
      break;
    }
    case 'Tab': e.preventDefault(); toggleHUD(); break;
    case 'Escape':
      // Cancel a pending power-up pick
      if (state.phase === 'awaiting-warp-pick' || state.phase === 'awaiting-trap-pick') {
        // Refund
        const p = state.pendingPowerup;
        if (p) {
          state.teams[p.teamIdx].inventory.push(p.kind);
        }
        state.pendingPowerup = null;
        state.phase = 'awaiting-roll';
        renderAll();
        toast('Cancelled');
      }
      break;
  }
});

function toggleFullscreen() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(()=>{});
  else document.exitFullscreen?.();
}
function toggleHUD() {
  state.hudCompact = !state.hudCompact;
  document.getElementById('hud').classList.toggle('compact', state.hudCompact);
}

// =====================================================================
// STAGE SCALING
// =====================================================================

function fitStage() {
  const stage = document.getElementById('stage');
  const sx = window.innerWidth / 1920;
  const sy = window.innerHeight / 1080;
  stage.style.transform = `scale(${Math.min(sx, sy)})`;
}
window.addEventListener('resize', fitStage);

// =====================================================================
// BOOT
// =====================================================================

function boot() {
  fitStage();
  renderAll();
  document.getElementById('primary-btn').onclick = onPrimary;
  document.getElementById('btn-undo').onclick = undo;
  document.getElementById('btn-mute').onclick = toggleMute;
  document.getElementById('btn-fs').onclick = toggleFullscreen;
  document.getElementById('btn-hud').onclick = toggleHUD;
  document.getElementById('victory-reset').onclick = resetGame;

  // Test/debug handle
  window.__game = {
    get state() { return state; },
    rollDice, pickTF, judgeTrivia, awardMinigameWinner,
    usePowerup, undo, resetGame, passTurn,
    BOARD_GRAPH, TRIVIA, POWERUPS, MINIGAMES, TEAMS_INIT,
  };
}
boot();
</script>
